# Cloudflare Worker: Profound Dynamic Bot Rendering
# Repo: colemooney-blue/bryan-johnson-profound-worker

# Must match the Cloudflare project name, or you'll end up with two Workers.
name = "bryan-johnson-profound-worker"
main = "src/index.js"
compatibility_date = "2026-09-16"

# No workers.dev URL. Without this the Worker is also reachable at
# bryan-johnson-profound-worker.<subdomain>.workers.dev, where url.hostname
# would be that workers.dev host — an unregistered host, so Profound 403s.
# Harmless (the Worker fails open) but it's noise you don't need.
workers_dev = false

[observability]
enabled = true

# ---------------------------------------------------------------------------
# ROUTES — leave commented out for the FIRST deploy.
#
# Order matters: deploy once with no route, set the PROFOUND_CONCIERGE_KEY
# secret, THEN uncomment this block and push again. Deploying the route before
# the secret exists puts a live Worker on /about that sends a literal
# "undefined" as the API key. Profound answers 401, which is in
# FAILOVER_STATUSES, so it fails open to your origin — no visitor impact, but
# you'd be debugging a silent no-op for no reason.
# ---------------------------------------------------------------------------

# [[routes]]
# pattern = "www.bryanjohnson.com/about*"
# zone_name = "bryanjohnson.com"